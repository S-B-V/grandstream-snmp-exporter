version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']
    commit-message:
      prefix: deps(go)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Berlin
    groups:
      docker-dependencies:
        patterns: ['*']
    commit-message:
      prefix: deps(docker)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: deps(ci)