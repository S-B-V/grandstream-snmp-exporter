name: CI and GHCR publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, test and build Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (latest patch within 1.27)
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Check Go formatting without modifying files
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          if (( ${#files[@]} > 0 )); then
            unformatted=$(gofmt -l "${files[@]}")
            if [[ -n "$unformatted" ]]; then
              printf 'Go files need formatting:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o exporter ./cmd/exporter

  publish:
    name: Build and publish linux/amd64 image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
