# Grafana sidecar dashboard ConfigMap. Requires a default Prometheus datasource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-grandstream-monitor
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  Grafana_Dashboard.json: |
    {
      "__requires": [
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "10.0.0"
        }
      ],
      "id": null,
      "uid": "grandstream-full",
      "title": "Grandstream Device Overview",
      "description": "SNMPv3 Grandstream device health and wireless metrics. AP client inventory is in the separate Wi-Fi Clients dashboard.",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "timezone": "browser",
      "tags": [
        "grandstream",
        "snmp",
        "wifi"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "target",
            "label": "Device",
            "type": "query",
            "datasource": null,
            "definition": "label_values(grandstream_exporter_up, device_ip)",
            "query": {
              "query": "label_values(grandstream_exporter_up, device_ip)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "current": {}
          },
          {
            "name": "interface",
            "label": "Interfaces",
            "type": "query",
            "datasource": null,
            "definition": "label_values(grandstream_if_mib_ifhcinoctets{device_ip=\"$target\"}, if_name)",
            "query": {
              "query": "label_values(grandstream_if_mib_ifhcinoctets{device_ip=\"$target\"}, if_name)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Exporter reachable",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_exporter_up{device_ip=\"$target\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          }
        },
        {
          "id": 2,
          "title": "System uptime",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_host_resources_mib_hrsystemuptime{device_ip=\"$target\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          }
        },
        {
          "id": 3,
          "title": "Average CPU",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "avg(grandstream_host_resources_mib_hrprocessorload{device_ip=\"$target\"})",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          }
        },
        {
          "id": 4,
          "title": "Memory used",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "100*grandstream_storage_utilization_ratio{device_ip=\"$target\",descr=\"Physical memory\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          }
        },
        {
          "id": 5,
          "title": "Connected AP clients",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_ap_clients{device_ip=\"$target\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          }
        },
        {
          "id": 6,
          "title": "CPU by core",
          "type": "timeseries",
          "gridPos": {
            "x": 6,
            "y": 4,
            "w": 9,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_host_resources_mib_hrprocessorload{device_ip=\"$target\"}",
              "legendFormat": "core {{core}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "title": "Storage utilization",
          "type": "timeseries",
          "gridPos": {
            "x": 15,
            "y": 4,
            "w": 9,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "100*grandstream_storage_utilization_ratio{device_ip=\"$target\"}",
              "legendFormat": "{{descr}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "AP client count over time",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_ap_clients{device_ip=\"$target\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "title": "AP radio throughput",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "rate(grandstream_ap_radio_rx_bytes{device_ip=\"$target\"}[$__rate_interval])*8",
              "legendFormat": "RX {{radio_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "expr": "rate(grandstream_ap_radio_tx_bytes{device_ip=\"$target\"}[$__rate_interval])*8",
              "legendFormat": "TX {{radio_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "title": "AP signal values (raw)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 9
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "grandstream_ap_client_signal{device_ip=\"$target\"}",
              "legendFormat": "{{device_ip}} {{hostname}} {{client_ip}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Raw Grandstream signal field; verify vendor scaling before labeling dBm."
        },
        {
          "id": 11,
          "title": "Interface throughput",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 12,
            "h": 9
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "rate(grandstream_if_mib_ifhcinoctets{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval])*8",
              "legendFormat": "RX {{if_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "expr": "rate(grandstream_if_mib_ifhcoutoctets{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval])*8",
              "legendFormat": "TX {{if_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "title": "Interface errors and discards",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 12,
            "h": 9
          },
          "datasource": null,
          "targets": [
            {
              "refId": "A",
              "expr": "rate(grandstream_if_mib_ifinerrors{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval]) + rate(grandstream_if_mib_ifindiscards{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval])",
              "legendFormat": "RX errors+drops {{if_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "expr": "rate(grandstream_if_mib_ifouterrors{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval]) + rate(grandstream_if_mib_ifoutdiscards{device_ip=\"$target\",if_name=~\"$interface\"}[$__rate_interval])",
              "legendFormat": "TX errors+drops {{if_name}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
